<!-- @dsCard group="Data" height=330 subtitle="Navy API card with request and response" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../dist/tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
<style>
  /* Previews are drawn at slide scale (1664px content width, the sizes in the
     type scale) and shrunk to fit the page, so what you read here is the real
     component, not a miniature drawn with smaller numbers. */
  body { margin: 0; }
  .ds-scale { zoom: .5; font-family: var(--font-sans); color: var(--text-primary); }
  .ds-ground { width: 1664px; padding: var(--space-5); }
  .ds-row { display: flex; gap: var(--space-4); }
  .ds-col { display: flex; flex-direction: column; gap: var(--space-2); }
  .ds-card { background: var(--card-bg); border-radius: var(--radius-card);
             box-shadow: var(--shadow-card); padding: var(--space-5); }
  .ds-card-dark { background: var(--card-inverse-bg); color: var(--text-inverse);
                  border-radius: var(--radius-card); box-shadow: var(--shadow-card-dark);
                  padding: var(--space-5); }
  .ds-pill { border-radius: var(--radius-pill);
             padding: var(--space-pill-y) var(--space-pill-x); }
  p, h1, h2, h3 { margin: 0; }
</style>
<div class="ds-scale"><div class="ds-ground" style="background:var(--bg-pink)">
  <div class="ds-card-dark ds-col" style="padding:var(--space-4) var(--space-5); color:var(--code-text)">
    <div class="ds-row" style="align-items:center; gap:var(--space-2)">
      <span class="ds-pill t-code" style="background:var(--positive-bg); color:var(--positive-ink); border-radius:var(--radius-tile); font-weight:700">POST</span>
      <span class="t-code">email-api.mailercloud.com/email</span>
    </div>
    <hr style="border:0; border-top:2px solid var(--navy-line); width:100%; margin:0">
    <pre class="t-code" style="margin:0">{
  <span style="color:var(--code-key)">"email"</span>: {
    <span style="color:var(--code-key)">"from"</span>: <span style="color:var(--code-string)">"support@yourbrand.com"</span>,
    <span style="color:var(--code-key)">"subject"</span>: <span style="color:var(--code-string)">"Re: Your support request"</span>
  },
  <span style="color:var(--code-key)">"metadata"</span>: {
    <span style="color:var(--code-key)">"campaignType"</span>: <span style="color:var(--code-string)">"TRANSACTIONAL"</span>
  }
}</pre>
    <hr style="border:0; border-top:2px solid var(--navy-line); width:100%; margin:0">
    <div class="ds-row" style="align-items:center; gap:var(--space-2)">
      <span class="ds-pill t-code" style="background:var(--positive-bg); color:var(--positive-ink); border-radius:var(--radius-tile); font-weight:700">200 OK</span>
      <span class="t-body" style="color:var(--text-inverse)">Email accepted</span>
    </div>
  </div>
</div></div>
