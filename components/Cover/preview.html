<!-- @dsCard height=320 -->
<link rel="stylesheet" href="../../dist/tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
<div style="position:relative; width:960px; height:320px; background:var(--bg-paper); overflow:hidden; font-family:var(--font-sans)">
<svg width="960" height="320" viewBox="0 0 960 320" style="position:absolute; left:0; top:0" aria-hidden="true">
<!--
blocks: bg-sky disc 272 wide (34 x space-1), bg-lime slab 144 x 152 (radius-card), navy pill 144 x 72 (radius-pill, rx = half the short side), bg-mint and bg-pink discs 48 wide.
arrangement: staggered; one large disc left of a stacked lime and navy column, two small discs beneath it, 16px (space-2) between the column blocks and 8px (space-1) to the discs.
pattern: soft, friendly, large radii -> discs; a 3 x 3 grid of 12px discs at 24px pitch (space-3) cut out of the sky disc in bg-paper.
steps and radii: space-1 8, space-2 16, space-3 24, space-4 32 (text inset); radius-card 28, radius-pill, radius-round.
-->
<style>
.sky{fill:var(--bg-sky)} .lime{fill:var(--bg-lime)} .navy{fill:var(--navy)} .mint{fill:var(--bg-mint)} .pink{fill:var(--bg-pink)} .cut{fill:var(--bg-paper)}
.card{rx:var(--radius-card)} .pill{rx:36px}
</style>
<circle class="sky" cx="640" cy="168" r="136"/>
<rect class="lime card" x="800" y="16" width="144" height="152"/>
<rect class="navy pill" x="800" y="184" width="144" height="72"/>
<circle class="mint" cx="836" cy="288" r="24"/>
<circle class="pink" cx="908" cy="288" r="24"/>
<g class="cut">
<circle class="cut" cx="616" cy="144" r="6"/><circle class="cut" cx="640" cy="144" r="6"/><circle class="cut" cx="664" cy="144" r="6"/>
<circle class="cut" cx="616" cy="168" r="6"/><circle class="cut" cx="640" cy="168" r="6"/><circle class="cut" cx="664" cy="168" r="6"/>
<circle class="cut" cx="616" cy="192" r="6"/><circle class="cut" cx="640" cy="192" r="6"/><circle class="cut" cx="664" cy="192" r="6"/>
</g>
</svg>
<div style="position:absolute; left:32px; bottom:32px; width:400px">
<h1 style="margin:0; font-size:64px; line-height:0.95; font-weight:700; color:var(--ink)">MailerCloud</h1>
<p style="margin:16px 0 0; font-size:14px; line-height:1.4; color:var(--ink-muted)">Colour-first documents, one message each.</p>
</div>
</div>
