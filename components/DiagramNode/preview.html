<link rel="stylesheet" href="../../dist/tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
<div style="background:var(--bg-lime); padding:28px 32px; font-family:var(--font-sans); color:var(--ink)">
  <div style="display:flex; align-items:center; gap:0">
    <div style="flex:1">
      <div style="display:inline-block; background:var(--surface-raised); border:3px solid var(--border-strong); border-radius:var(--radius-pill); padding:4px 16px; font-size:13px; font-weight:700; letter-spacing:1px; text-transform:uppercase">Inbound · No change</div>
      <div style="margin-top:10px; background:var(--card-bg); border:3px solid var(--node-line); border-radius:var(--radius-card); box-shadow:var(--shadow-small); padding:16px 20px">
        <div style="font-size:18px; font-weight:700">Microsoft 365</div>
        <div style="font-size:14px; line-height:1.4; margin-top:2px">One shared mailbox, MX unchanged</div>
      </div>
    </div>
    <div style="width:110px; text-align:center; font-size:13px; font-weight:500; line-height:1.4">
      <div><b>2</b> Synced to<br>the workspace</div>
      <svg width="110" height="14" viewBox="0 0 110 14" aria-hidden="true"><line x1="4" y1="7" x2="100" y2="7" stroke="var(--border-strong)" stroke-width="3" stroke-linecap="round"/><path d="M92 1 L104 7 L92 13" fill="none" stroke="var(--border-strong)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div style="flex:1; background:var(--card-bg); border:3px solid var(--node-line); border-radius:var(--radius-card); box-shadow:var(--shadow-small); padding:16px 20px; align-self:flex-end">
      <div style="font-size:18px; font-weight:700">Support workspace</div>
      <div style="font-size:14px; line-height:1.4; margin-top:2px">Helpdesk or support app</div>
    </div>
  </div>
  <div style="display:flex; align-items:center; margin-top:22px">
    <div style="flex:1; background:var(--node-inverse-bg); border:3px solid var(--node-inverse-bg); border-radius:var(--radius-card); box-shadow:var(--shadow-small); padding:16px 20px; color:var(--text-inverse)">
      <div style="font-size:18px; font-weight:700">MailerCloud</div>
      <div style="font-size:14px; line-height:1.4; margin-top:2px; color:var(--bg-lime)">SMTP relay or Email API, signed and logged</div>
    </div>
    <div style="width:110px; text-align:center; font-size:13px; font-weight:500; line-height:1.4">
      <div><b>4</b> Signed reply<br>to the inbox</div>
      <svg width="110" height="14" viewBox="0 0 110 14" aria-hidden="true"><line x1="106" y1="7" x2="14" y2="7" stroke="var(--action-primary)" stroke-width="5" stroke-linecap="round"/><path d="M22 1 L10 7 L22 13" fill="none" stroke="var(--action-primary)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div style="flex:1; background:var(--card-bg); border:3px solid var(--node-line); border-radius:var(--radius-card); box-shadow:var(--shadow-small); padding:16px 20px">
      <div style="font-size:18px; font-weight:700">Customers</div>
      <div style="font-size:14px; line-height:1.4; margin-top:2px">Gmail, Outlook, Yahoo, corporate mail</div>
    </div>
  </div>
</div>
