<div style="background:var(--bg-cream); padding:24px 32px; font-family:var(--font-sans); color:var(--ink)">
  <div style="font-size:16px; font-weight:700; margin-bottom:12px">Daily volume ramp, emails per day</div>
  <div style="display:flex; align-items:flex-end; gap:16px; height:190px">
    <div style="flex:1; text-align:center"><div style="font-size:14px; font-weight:700">10K</div><div style="height:63px; background:var(--chart-1); border-radius:var(--radius-tile) var(--radius-tile) 0 0; margin-top:4px"></div><div style="font-size:14px; margin-top:6px">Day 1</div></div>
    <div style="flex:1; text-align:center"><div style="font-size:14px; font-weight:700">15K</div><div style="height:95px; background:var(--chart-1); border-radius:var(--radius-tile) var(--radius-tile) 0 0; margin-top:4px"></div><div style="font-size:14px; margin-top:6px">Day 2</div></div>
    <div style="flex:1; text-align:center"><div style="font-size:14px; font-weight:700">20K</div><div style="height:127px; background:var(--chart-1); border-radius:var(--radius-tile) var(--radius-tile) 0 0; margin-top:4px"></div><div style="font-size:14px; margin-top:6px">Day 3</div></div>
    <div style="flex:1; text-align:center"><div style="font-size:14px; font-weight:700">30K</div><div style="height:150px; background:var(--chart-2); border-radius:var(--radius-tile) var(--radius-tile) 0 0; margin-top:4px"></div><div style="font-size:14px; margin-top:6px">Day 4 onward</div></div>
  </div>
</div>
