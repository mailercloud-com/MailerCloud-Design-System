<!-- @dsCard group="Data" height=230 subtitle="Big figure with a label; KPI tiles" -->
<link rel="stylesheet" href="../../dist/tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
<div style="background:var(--bg-pink); padding:32px; font-family:var(--font-sans); color:var(--ink)">
  <div style="display:flex">
    <div style="flex:1; padding-right:24px">
      <div style="font-size:40px; font-weight:700; line-height:1.1">6 Billion+</div>
      <div style="font-size:15px; line-height:1.4; margin-top:4px">emails delivered every month</div>
    </div>
    <div style="flex:1; padding:0 24px; border-left:3px solid var(--ink)">
      <div style="font-size:40px; font-weight:700; line-height:1.1">95%</div>
      <div style="font-size:15px; line-height:1.4; margin-top:4px">client retention</div>
    </div>
    <div style="flex:1; padding-left:24px; border-left:3px solid var(--ink)">
      <div style="font-size:40px; font-weight:700; line-height:1.1">50K+</div>
      <div style="font-size:15px; line-height:1.4; margin-top:4px">monthly campaigns</div>
    </div>
  </div>
  <div style="display:flex; gap:12px; margin-top:24px">
    <div style="flex:1; background:var(--surface-zebra); border-radius:var(--radius-tile); padding:12px 16px">
      <div style="font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--ink-muted)">Delivered</div>
      <div style="font-size:24px; font-weight:700">1,20,000</div>
      <div style="font-size:12px">96.0% of sent</div>
    </div>
    <div style="flex:1; background:var(--attention-bg); border-radius:var(--radius-tile); padding:12px 16px">
      <div style="font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--attention-ink)">Blocked</div>
      <div style="font-size:24px; font-weight:700">480</div>
      <div style="font-size:12px; font-weight:700; color:var(--attention-ink)">Worth a closer look</div>
    </div>
  </div>
</div>
