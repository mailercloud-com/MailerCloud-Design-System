<!-- @dsCard group="Data" height=300 subtitle="Navy header, zebra rows, attention rows" -->
<link rel="stylesheet" href="../../dist/tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
<div style="background:var(--bg-paper); padding:24px; font-family:var(--font-sans); color:var(--ink)">
  <table style="width:100%; border-collapse:collapse; font-size:13px">
    <tr style="background:var(--navy); color:#ffffff">
      <th style="text-align:left; padding:8px 12px">Account</th>
      <th style="text-align:right; padding:8px 12px">Emails sent</th>
      <th style="text-align:right; padding:8px 12px">Delivered</th>
      <th style="text-align:right; padding:8px 12px">Hard bounce</th>
    </tr>
    <tr style="background:var(--bg-paper); border-bottom:1px solid var(--line)"><td style="padding:8px 12px; font-weight:700">Account A</td><td style="text-align:right; padding:8px 12px">6,00,000</td><td style="text-align:right; padding:8px 12px">96.2%</td><td style="text-align:right; padding:8px 12px">0.02%</td></tr>
    <tr style="background:var(--surface-zebra); border-bottom:1px solid var(--line)"><td style="padding:8px 12px; font-weight:700">Account B</td><td style="text-align:right; padding:8px 12px">3,50,000</td><td style="text-align:right; padding:8px 12px">96.3%</td><td style="text-align:right; padding:8px 12px">0.04%</td></tr>
    <tr style="background:var(--attention-bg); border-bottom:1px solid var(--line)"><td style="padding:8px 12px; font-weight:700">Account C</td><td style="text-align:right; padding:8px 12px">3,20,000</td><td style="text-align:right; padding:8px 12px">95.7%</td><td style="text-align:right; padding:8px 12px; font-weight:700; color:var(--attention-ink)">0.8%</td></tr>
  </table>
  <p style="font-size:12px; color:var(--ink-muted); margin:8px 0 0">Highlighted rows have a hard bounce rate of 0.5% or higher.</p>
</div>
